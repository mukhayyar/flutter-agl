# ============================================================
# meta-flutter-ics-homescreen — customisation layer
# ============================================================
# bbappends for the AGL Flutter ICS homescreen recipe, carried
# next to a fork of the application itself.
#
# The layer is not self-contained: it must be added *after*
# meta-agl-demo (which ships the recipes being appended).
# ============================================================

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-flutter-ics-homescreen"
BBFILE_PATTERN_meta-flutter-ics-homescreen = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-flutter-ics-homescreen = "72"

# core            — OE-Core
# flutter-layer   — meta-flutter (flutter-app class, flutter-auto)
# agldemo         — meta-agl-demo (flutter-ics-homescreen recipe)
LAYERDEPENDS_meta-flutter-ics-homescreen = "core flutter-layer agldemo"

# AGL trout is Yocto 5.0 (scarthgap), poky 5.0.15
LAYERSERIES_COMPAT_meta-flutter-ics-homescreen = "scarthgap"
